
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EDIT STUDENT RECORD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <div class="card-body">
        <form action="/update_stud" method="POST" name="frmStud" id="frmStud">
            <h2>EDIT STUDENT RECORD</h2>
            <br>

            <!-- TEXT INPUT ELEMENTS -->
            <div class="form-group">
                <label for="StudID">Student ID:</label>
                <input type="text" class="form-control" name="StudID" id="StudID" placeholder="Enter student id" value="{{ row['Student_ID'] }}" required>
            </div>

            <div class="form-group">
                <label for="LastName">Last Name:</label>
                <input type="text" class="form-control" name="LastName" id="LastName" placeholder="Enter last name" value="{{ row['Last_Name'] }}" required>
            </div>

            <div class="form-group">
                <label for="FirstName">First Name:</label>
                <input type="text" class="form-control" name="FirstName" id="FirstName" placeholder="Enter first name" value="{{ row['First_Name'] }}" required>
            </div>

            <div class="form-group">
                <label for="MiddleName">Middle Name:</label>
                <input type="text" class="form-control" name="MiddleName" id="MiddleName" placeholder="Enter middle name" value="{{ row['Middle_Name'] }}" required>
            </div>

            <div class="form-group">
                <label for="Address">Home Address:</label>
                <input type="text" class="form-control" name="Address" id="Address" placeholder="Enter home address" value="{{ row['Home_Address'] }}" required>
            </div>

            <div class="form-group">
                <label for="EmailAdd">Email Address:</label>
                <input type="text" class="form-control" name="EmailAdd" id="EmailAdd" placeholder="Enter email address" value="{{ row['Email_Address'] }}" required>
            </div>

            <div class="form-group">
                <label for="Age">Age:</label>
                <input type="number" class="form-control" name="Age" id="Age" placeholder="Enter age" value="{{ row['Age'] }}" required>
            </div>

            <div class="form-group">
                <label for="Birthday">Birthday:</label>
                <input type="date" class="form-control" name="Birthday" id="Birthday" placeholder="Enter birthday" value="{{ row['Birthday'] }}" required>
            </div>

            <div class="form-group">
                <label for="Gender">Gender:</label>
                <select class="form-control form-select" id="Gender" name="Gender" required>
                    <option value="{{ row['Gender'] }}" selected>{{ row['Gender'] }}</option>
                    <option value="MALE">ADMINISTRATOR</option>
                    <option value="FEMALE 1">USER LEVEL 1</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Course">Course:</label>
                <select class="form-control form-select" id="Course" name="Course" required>
                    <option value="{{ row['Course'] }}" selected>{{ row['Course'] }}</option>
                    <option value="ACTIVE">BSIT</option>
                    <option value="INACTIVE">BSCS</option>
                </select>
            </div>

            <!-- ACTION OR COMMAND BUTTONS -->
            <br>
            <div class="form-group">
                <button type="submit" class="form-control btn btn-primary mb-2" id="btnSubmit">UPDATE RECORD</button>
            </div>
        </form>
    </div>
</body>
</html>
